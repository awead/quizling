[project]
name = "quizling"
version = "0.1.0"
description = "Generate multiple choice questions from documents using Azure OpenAI"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai>=1.1.0",
    "pydantic>=2.0.0",
    "pymongo>=4.10.0",
    "python-dotenv>=1.0.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.0",
    "ipython>=9.6.0",
    "fastapi[standard]>=0.119.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflict with `ruff format`.
    "COM812",
    # docs/coding-standards.md requires docstrings on public functions and methods only.
    "D100",
    "D101",
    "D104",
    "D105",
    "D106",
    "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    # docs/coding-standards.md: tests get no docstrings.
    "D",
    # pytest is assert-based.
    "S101",
    # Tests compare against literal expected values.
    "PLR2004",
    # Tests inspect private helpers directly.
    "SLF001",
]
# Standalone scripts, not a package: they print results and need no docstrings.
"examples/**" = ["D", "T201", "INP001"]
# CLI entry points and the IPython console write to the terminal.
"src/quizling/__main__.py" = ["T201"]
"src/quizling/storage/__main__.py" = ["T201"]
"src/quizling/utils/console.py" = ["T201"]
